@model SmartMotoRental.Models.RentalOrder

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartMotoRental</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container mt-5">

        <h3 style="color: #11bae9;" class="text-center">Đặt Thuê Xe Máy</h3>
        <p class="text-center">Chọn địa điểm và thuê xe phù hợp với lịch trình của bạn</p>

        <div class="row">
            <div class="col-3"></div>

            <div class="col-6">
                <div class="card">
                    <div class="card-header">
                        <h5 style="color: #11bae9;">Địa Điểm Thuê & Trả Xe</h5>
                    </div>

                    <div class="card-body">

                        <form asp-action="Index" method="post">
                            @Html.AntiForgeryToken()

                            <!-- Customer Name -->
                            <div class="mb-3">
                                <label class="form-label">Họ Tên Khách Hàng</label>
                                <input asp-for="CustomerName" class="form-control" placeholder="Nguyễn Văn A" />
                                <span asp-validation-for="CustomerName" class="text-danger"></span>
                            </div>

                            <!-- Phone -->
                            <div class="mb-3">
                                <label class="form-label">Số Điện Thoại</label>
                                <input asp-for="PhoneNumber" class="form-control" placeholder="0987xxxxxx" />
                                <span asp-validation-for="PhoneNumber" class="text-danger"></span>
                            </div>

                            <!-- Pickup Location -->
                            <div class="row">
                                <div class="col-12">
                                    <label>Địa Điểm Nhận Xe</label>
                                    <input asp-for="PickupLocation" class="form-control"
                                        placeholder="Ví dụ: Đà Nẵng, Sân Bay Đà Nẵng" />
                                    <span asp-validation-for="PickupLocation" class="text-danger"></span>
                                </div>
                            </div>

                            <!-- Return Location -->
                            <div class="row mt-3">
                                <div class="col-12">
                                    <label>Địa Điểm Trả Xe</label>
                                    <input asp-for="ReturnLocation" class="form-control"
                                        placeholder="Mặc định giống điểm nhận" />
                                    <span asp-validation-for="ReturnLocation" class="text-danger"></span>
                                </div>
                            </div>

                            <!-- Pickup date & time -->
                            <div class="row mt-3">
                                <div class="col-6">
                                    <label>Ngày Nhận Xe</label>
                                    <input asp-for="PickupDate" type="date" class="form-control" />
                                    <span asp-validation-for="PickupDate" class="text-danger"></span>
                                </div>

                                <div class="col-6">
                                    <label>Giờ Nhận Xe</label>
                                    <input asp-for="PickupTime" type="time" class="form-control" />
                                    <span asp-validation-for="PickupTime" class="text-danger"></span>
                                </div>
                            </div>

                            <!-- Return date & time -->
                            <div class="row mt-3">
                                <div class="col-6">
                                    <label>Ngày Trả Xe</label>
                                    <input asp-for="ReturnDate" type="date" class="form-control" />
                                    <span asp-validation-for="ReturnDate" class="text-danger"></span>
                                </div>

                                <div class="col-6">
                                    <label>Giờ Trả Xe</label>
                                    <input asp-for="ReturnTime" type="time" class="form-control" />
                                    <span asp-validation-for="ReturnTime" class="text-danger"></span>
                                </div>
                            </div>

                            <div class="text-end">
                                <button class="mt-3 btn btn-success" type="submit">Đặt xe</button>
                            </div>

                        </form>

                    </div>
                </div>
            </div>

            <div class="col-3"></div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
